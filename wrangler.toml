name = "blog"
compatibility_date = "2026-08-04"
main = "./src/worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1